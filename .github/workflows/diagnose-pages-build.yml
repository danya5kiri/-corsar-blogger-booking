name: Diagnose latest Pages build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: read

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Show Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" \
            --jq '{status, build_type, source, html_url}'

      - name: Show latest Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages/builds/latest" \
            --jq '{status, commit, created_at, updated_at, error}'
