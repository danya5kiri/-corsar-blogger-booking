name: Apply booking history fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/restore-booking-history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/restore-booking-history
          token: ${{ github.token }}

      - name: Apply archive visibility fix
        run: node scripts/apply-booking-history-fix.mjs

      - name: Remove one-time files
        run: |
          rm scripts/apply-booking-history-fix.mjs
          rm .github/workflows/apply-booking-history-fix.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm test

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creacloud-app.tsx src/globals.css tests/mobile-platform.spec.mjs
          git add -u scripts/apply-booking-history-fix.mjs .github/workflows/apply-booking-history-fix.yml
          git commit -m "Восстановить историю бронирований календаря"
          git push origin HEAD:fix/restore-booking-history
