name: Publish CREACLOUD for legacy Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "fonts/**"
      - "index.html"
      - "favicon.svg"
      - ".nojekyll"
      - ".pages-refresh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm test

      - name: Copy production files to Pages root
        run: |
          rm -rf assets fonts
          cp -R dist/assets assets
          cp -R dist/fonts fonts
          cp dist/index.html index.html
          cp dist/favicon.svg favicon.svg
          touch .nojekyll

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets fonts favicon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "Production files are already current."
            exit 0
          fi
          git commit -m "Publish CREACLOUD production build [skip ci]"
          git push
