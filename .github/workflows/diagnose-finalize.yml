name: Diagnose finalization run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Show recent main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?branch=main&event=push&per_page=10" \
            --jq '.workflow_runs[] | {id,name,status,conclusion,head_sha,created_at,updated_at}'

      - name: Show check run diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/273cf9b22607cf2738a48f3be2c6c107ae5632d5/check-runs" \
            --jq '.check_runs[] | {name,status,conclusion,output}'
