name: Diagnose finalization run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Show recent main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?branch=main&event=push&per_page=20" \
            --jq '.workflow_runs[] | {id,name,status,conclusion,head_sha,created_at,updated_at}'
