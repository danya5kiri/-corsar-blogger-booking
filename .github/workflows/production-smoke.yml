name: Verify public CREACLOUD site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "fonts/**"
      - "index.html"
      - "favicon.svg"
      - ".nojekyll"
      - ".pages-refresh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-smoke
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build expected production files
        run: |
          npm ci
          npm run build

      - name: Wait for matching public deployment
        env:
          SITE_URL: https://danya5kiri.github.io/-corsar-blogger-booking/
        run: |
          EXPECTED_JS=$(grep -oE '/-corsar-blogger-booking/assets/[^" ]+\.js' dist/index.html | head -1)
          EXPECTED_CSS=$(grep -oE '/-corsar-blogger-booking/assets/[^" ]+\.css' dist/index.html | head -1)
          test -n "${EXPECTED_JS}"
          test -n "${EXPECTED_CSS}"

          for attempt in {1..24}; do
            CACHE_BUSTER="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error --location \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              "${SITE_URL}?build=${CACHE_BUSTER}" \
              --output /tmp/public-index.html; then
              if grep -Fq "${EXPECTED_JS}" /tmp/public-index.html && \
                 grep -Fq "${EXPECTED_CSS}" /tmp/public-index.html && \
                 grep -Fq "CREACLOUD — кабинет креаторов «Корсар»" /tmp/public-index.html; then
                curl --fail --silent --show-error --location \
                  "https://danya5kiri.github.io${EXPECTED_JS}?build=${CACHE_BUSTER}" \
                  --output /tmp/public-app.js
                curl --fail --silent --show-error --location \
                  "https://danya5kiri.github.io${EXPECTED_CSS}?build=${CACHE_BUSTER}" \
                  --output /tmp/public-app.css
                test -s /tmp/public-app.js
                test -s /tmp/public-app.css
                echo "Public site matches the expected production build."
                exit 0
              fi
            fi
            echo "Waiting for public deployment, attempt ${attempt}/24..."
            sleep 10
          done

          echo "Expected JavaScript: ${EXPECTED_JS}"
          echo "Expected CSS: ${EXPECTED_CSS}"
          echo "Last public index response:"
          cat /tmp/public-index.html || true
          exit 1
