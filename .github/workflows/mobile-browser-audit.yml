name: Mobile browser audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run dev -- --port 4173 > /tmp/creacloud-vite.log 2>&1 &
          echo $! > /tmp/creacloud-vite.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/vite-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/creacloud-vite.log
          exit 1

      - name: Run mobile browser scenarios
        run: npx playwright test tests/mobile-platform.spec.mjs --reporter=line

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-results
          path: |
            test-results
            playwright-report
            /tmp/creacloud-vite.log
          if-no-files-found: ignore
