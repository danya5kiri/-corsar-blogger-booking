name: Finalize CREACLOUD platform

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[platform finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply final production refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("src/creacloud-app.tsx")
          app = app_path.read_text()

          app = app.replace(
              "const WEATHER_REFRESH_INTERVAL_MS = 15 * 60 * 1000;",
              "const WEATHER_REFRESH_INTERVAL_MS = 10 * 60 * 1000;",
          )
          app = app.replace(
              "Проверяем погоду каждые 15 минут",
              "Проверяем погоду каждые 10 минут",
          )

          old_initial = '''    const dataRequest = refreshWorkingDataRef.current({ force: true });

    const weatherRequest = refreshWeatherRef.current({ force: true });

    Promise.allSettled([dataRequest, weatherRequest]).then(() => {
      const remaining = Math.max(0, 1450 - (Date.now() - startedAt));
      window.setTimeout(() => {
        if (!cancelled) setLoading(false);
      }, remaining);
    });

    return () => {
      cancelled = true;
    };'''
          new_initial = '''    void refreshWorkingDataRef.current({ force: true });
    void refreshWeatherRef.current({ force: true });

    const remaining = Math.max(0, 950 - (Date.now() - startedAt));
    const splashTimer = window.setTimeout(() => {
      if (!cancelled) setLoading(false);
    }, remaining);

    return () => {
      cancelled = true;
      window.clearTimeout(splashTimer);
    };'''
          if old_initial in app:
              app = app.replace(old_initial, new_initial, 1)

          old_disabled = '''            cell.date > SEASON_END ||
            scheduled.length === 0;'''
          new_disabled = '''            cell.date > SEASON_END ||
            scheduled.length === 0 ||
            occupied === scheduled.length;'''
          if old_disabled in app:
              app = app.replace(old_disabled, new_disabled, 1)

          app_path.write_text(app)

          verify_path = Path("scripts/verify-site.mjs")
          verify = verify_path.read_text()
          anchor = "assert.match(app, /POST_WRITE_SYNC_DELAYS/);"
          additions = '''assert.match(app, /WEATHER_REFRESH_INTERVAL_MS = 10 \\* 60 \\* 1000/);
assert.match(app, /occupied === scheduled.length/);
assert.match(app, /PORTAL_TRANSITION_MIN_MS/);'''
          if additions not in verify:
              if anchor not in verify:
                  raise RuntimeError("Verification anchor was not found")
              verify = verify.replace(anchor, f"{anchor}\n{additions}", 1)
          verify_path.write_text(verify)
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm test

      - name: Verify live base and 16-day weather
        env:
          API_URL: https://script.google.com/macros/s/AKfycbyRUzCwCTkj4TzURMsYfCZGVRrZnxoeoqTzz76w3n9qz-JlU4ji2i3e1xYQr4CymGsf8Q/exec
        run: |
          CALLBACK="creacloudFinalAudit"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
            "${API_URL}?callback=${CALLBACK}&t=$(date +%s)" \
            --output /tmp/base.js
          grep -qi 'katerinamanko.ru' /tmp/base.js

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
            'https://api.open-meteo.com/v1/forecast?latitude=43.1155&longitude=131.8855&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=Asia%2FVladivostok' \
            --output /tmp/weather.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const weather = JSON.parse(fs.readFileSync('/tmp/weather.json', 'utf8'));
          if ((weather.daily?.time ?? []).length !== 16) {
            throw new Error('Weather provider did not return 16 forecast days');
          }
          NODE

      - name: Remove temporary audit files
        run: |
          rm -f \
            .github/workflows/apply-platform-reliability-patch.yml \
            .github/workflows/apply-platform-reliability.yml \
            .github/workflows/live-base-order.yml \
            .github/workflows/live-platform-audit.yml \
            .github/workflows/repair-creacloud-pr45.yml \
            reliability-test.exit \
            reliability-test.log \
            scripts/apply-platform-reliability-patch.py \
            scripts/apply-platform-reliability.mjs \
            scripts/audit-live-base.mjs \
            scripts/fix-recent-events-policy.mjs \
            scripts/fix-reliability-types.mjs

      - name: Commit final platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Финализировать CREACLOUD после полного аудита [platform finalized]"
          git push origin HEAD:main
