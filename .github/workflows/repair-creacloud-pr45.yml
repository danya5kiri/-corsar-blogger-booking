name: Apply final CREACLOUD refinements

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply refinements
        run: python3 scripts/finalize-creacloud.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm test

      - name: Commit refinements
        run: |
          rm -f scripts/finalize-creacloud.py .github/workflows/repair-creacloud-pr45.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ускорить загрузку и обновление данных CREACLOUD [final refinements]"
          git push origin HEAD:main
