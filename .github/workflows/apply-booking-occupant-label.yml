name: Apply booking occupant label

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'edit/show-booking-occupant'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout edit branch
        uses: actions/checkout@v6
        with:
          ref: edit/show-booking-occupant
          token: ${{ github.token }}

      - name: Update occupied tour label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/creacloud-app.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<small>{occupant ? "Занято" : "Свободно"}</small>'
          new = '<small>{occupant ? `Занято · ${occupant.creator}` : "Свободно"}</small>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one occupied label, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-booking-occupant-label.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify site
        run: |
          npm ci
          npm test

      - name: Commit edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creacloud-app.tsx .github/workflows/apply-booking-occupant-label.yml
          git commit -m "Показывать ник занявшего тур креатора"
          git push origin HEAD:edit/show-booking-occupant
