name: Apply CREACLOUD reliability patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/platform-reliability-2026-07-25'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: audit/platform-reliability-2026-07-25
          token: ${{ github.token }}

      - name: Determine required work
        id: patch-state
        run: |
          if grep -q "PORTAL_TRANSITION_MIN_MS" src/creacloud-app.tsx; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f reliability-test.exit ] && [ "$(cat reliability-test.exit)" != "0" ]; then
            echo "repair=true" >> "$GITHUB_OUTPUT"
          else
            echo "repair=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -q "LEGACY_BOOKING_NOTICE_LIMIT" src/creacloud-app.tsx; then
            echo "notice=false" >> "$GITHUB_OUTPUT"
          else
            echo "notice=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.patch-state.outputs.apply == 'true' || steps.patch-state.outputs.repair == 'true' || steps.patch-state.outputs.notice == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        if: steps.patch-state.outputs.apply == 'true'
        run: node scripts/apply-platform-reliability.mjs

      - name: Apply type correction
        if: steps.patch-state.outputs.repair == 'true'
        run: node scripts/fix-reliability-types.mjs

      - name: Apply daily notice policy
        if: steps.patch-state.outputs.notice == 'true'
        run: node scripts/fix-recent-events-policy.mjs

      - name: Install dependencies
        if: steps.patch-state.outputs.apply == 'true' || steps.patch-state.outputs.repair == 'true' || steps.patch-state.outputs.notice == 'true'
        run: npm ci

      - name: Capture verification result
        if: steps.patch-state.outputs.apply == 'true' || steps.patch-state.outputs.repair == 'true' || steps.patch-state.outputs.notice == 'true'
        run: |
          set +e
          npm test > reliability-test.log 2>&1
          TEST_EXIT=$?
          set -e
          echo "${TEST_EXIT}" > reliability-test.exit
          cat reliability-test.log

      - name: Commit source and diagnostics
        if: steps.patch-state.outputs.apply == 'true' || steps.patch-state.outputs.repair == 'true' || steps.patch-state.outputs.notice == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/creacloud-app.tsx \
            src/creacloud-data.ts \
            src/creacloud-api.ts \
            src/main.tsx \
            reliability-test.exit
          git add -f reliability-test.log
          if git diff --cached --quiet; then
            echo "No source or diagnostic changes to commit."
          else
            git commit -m "Проверить последние события и надежность площадки [reliability applied]"
            git push origin HEAD:audit/platform-reliability-2026-07-25
          fi

      - name: Fail after preserving diagnostics
        if: steps.patch-state.outputs.apply == 'true' || steps.patch-state.outputs.repair == 'true' || steps.patch-state.outputs.notice == 'true'
        run: test "$(cat reliability-test.exit)" = "0"
