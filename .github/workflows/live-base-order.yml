name: Check live base order

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Save compact live base order
        run: node scripts/audit-live-base.mjs > live-base-order.json

      - name: Upload order report
        uses: actions/upload-artifact@v4
        with:
          name: live-base-order
          path: live-base-order.json
          if-no-files-found: error
