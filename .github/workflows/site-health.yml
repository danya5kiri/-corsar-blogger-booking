name: Проверить здоровье сайта

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            "repos/${{ github.repository }}/pages" \
            -f build_type=workflow

          BUILD_TYPE="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          echo "GitHub Pages build type: ${BUILD_TYPE}"
          test "${BUILD_TYPE}" = "workflow"

  site-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm test
